# STRICT: deny-by-default. The only network access comes from the attached provider
# (openrouter.ai for the model, python only). Filesystem is limited to the sandbox workspace
# (/sandbox) and /tmp; everything else is read-only system paths.
#
# NOTE: filesystem_policy / landlock / process are startup-only. Strict and Research share these
# blocks verbatim so presets can be switched live (only network_policies changes).
version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /etc, /var/log, /proc, /dev/urandom]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: "1000"
  run_as_group: "1000"
network_policies: {}
