# RESEARCH: strict + a small allowlist of public read-only hosts for the python interpreter.
# Same filesystem/landlock/process blocks as strict.yaml (startup-only, must not change live).
version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /etc, /var/log, /proc, /dev/urandom]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: "1000"
  run_as_group: "1000"
network_policies:
  research_hosts:
    name: research_hosts
    endpoints:
      - {host: en.wikipedia.org, port: 443, protocol: rest, access: read-only, enforcement: enforce}
      - {host: docs.python.org, port: 443, protocol: rest, access: read-only, enforcement: enforce}
      - {host: example.com, port: 443, protocol: rest, access: read-only, enforcement: enforce}
    binaries:
      - path: /usr/local/bin/python3.12
